<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="50%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#ECE2D0"/>
    </linearGradient>
    <linearGradient id="sepiaTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3024"/>
      <stop offset="100%" stop-color="#1E1610"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C5B69F" stroke-width="0.8" opacity="0.35"/>
    </pattern>
    <pattern id="skyLines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="100" y2="2" stroke="#B8A890" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="600" fill="url(#paperGrad)"/>
  <rect width="800" height="600" fill="url(#hatch)"/>
  <rect x="25" y="25" width="750" height="490" fill="url(#skyLines)"/>

  <!-- Vintage Double Border Frame -->
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#2B2117" stroke-width="3"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#2B2117" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Corner Ornaments -->
  <g fill="#2B2117">
    <circle cx="21" cy="21" r="4"/>
    <circle cx="779" cy="21" r="4"/>
    <circle cx="21" cy="579" r="4"/>
    <circle cx="779" cy="579" r="4"/>
  </g>

  <!-- Graphic Elements -->
  <g transform="translate(0, 0)">
    
    <rect x="40" y="410" width="720" height="80" fill="#D8CFBD" stroke="#2B2117" stroke-width="2"/>
    <rect x="120" y="220" width="560" height="190" fill="#FAF5ED" stroke="#2B2117" stroke-width="3"/>
    <polygon points="100,220 400,140 700,220" fill="#E8DEC8" stroke="#2B2117" stroke-width="3"/>
    <rect x="240" y="165" width="320" height="35" fill="#FAF5ED" stroke="#2B2117" stroke-width="2"/>
    <text x="400" y="188" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" font-weight="900" fill="#2B2117" letter-spacing="4">GEDUNG MERDEKA</text>
    <!-- Grand Classical Columns -->
    <g fill="#F5EFE3" stroke="#2B2117" stroke-width="2">
      
        <rect x="160" y="220" width="22" height="190"/>
        <rect x="155" y="215" width="32" height="10"/>
        <rect x="155" y="405" width="32" height="10"/>
      
        <rect x="228" y="220" width="22" height="190"/>
        <rect x="223" y="215" width="32" height="10"/>
        <rect x="223" y="405" width="32" height="10"/>
      
        <rect x="296" y="220" width="22" height="190"/>
        <rect x="291" y="215" width="32" height="10"/>
        <rect x="291" y="405" width="32" height="10"/>
      
        <rect x="364" y="220" width="22" height="190"/>
        <rect x="359" y="215" width="32" height="10"/>
        <rect x="359" y="405" width="32" height="10"/>
      
        <rect x="432" y="220" width="22" height="190"/>
        <rect x="427" y="215" width="32" height="10"/>
        <rect x="427" y="405" width="32" height="10"/>
      
        <rect x="500" y="220" width="22" height="190"/>
        <rect x="495" y="215" width="32" height="10"/>
        <rect x="495" y="405" width="32" height="10"/>
      
        <rect x="568" y="220" width="22" height="190"/>
        <rect x="563" y="215" width="32" height="10"/>
        <rect x="563" y="405" width="32" height="10"/>
      
        <rect x="636" y="220" width="22" height="190"/>
        <rect x="631" y="215" width="32" height="10"/>
        <rect x="631" y="405" width="32" height="10"/>
      
    </g>
    <path d="M 360 410 L 360 320 A 40 40 0 0 1 440 320 L 440 410 Z" fill="#3D291D" stroke="#2B2117" stroke-width="2.5"/>
    
  </g>

  <!-- Bottom Label Ribbon / Plaque -->
  <g transform="translate(400, 554)">
    <rect x="-240" y="-18" width="480" height="36" fill="#F4EDE0" stroke="#2B2117" stroke-width="2"/>
    <rect x="-234" y="-14" width="468" height="28" fill="none" stroke="#7A6652" stroke-width="0.8"/>
    <!-- Left / Right Ribbon Notches -->
    <polygon points="-240,-18 -252,0 -240,18" fill="#ECE2D0" stroke="#2B2117" stroke-width="1.5"/>
    <polygon points="240,-18 252,0 240,18" fill="#ECE2D0" stroke="#2B2117" stroke-width="1.5"/>
    
    <text x="0" y="-1" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="900" letter-spacing="3" fill="#1E1610">
      GEDUNG MERDEKA
    </text>
    <text x="0" y="11" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#7A6652">
      BANDUNG · KONFERENSI ASIA AFRIKA 1955
    </text>
  </g>
</svg>