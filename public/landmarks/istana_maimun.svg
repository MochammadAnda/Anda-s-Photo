<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="50%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#ECE2D0"/>
    </linearGradient>
    <linearGradient id="sepiaTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3024"/>
      <stop offset="100%" stop-color="#1E1610"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C5B69F" stroke-width="0.8" opacity="0.35"/>
    </pattern>
    <pattern id="skyLines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="100" y2="2" stroke="#B8A890" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="600" fill="url(#paperGrad)"/>
  <rect width="800" height="600" fill="url(#hatch)"/>
  <rect x="25" y="25" width="750" height="490" fill="url(#skyLines)"/>

  <!-- Vintage Double Border Frame -->
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#2B2117" stroke-width="3"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#2B2117" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Corner Ornaments -->
  <g fill="#2B2117">
    <circle cx="21" cy="21" r="4"/>
    <circle cx="779" cy="21" r="4"/>
    <circle cx="21" cy="579" r="4"/>
    <circle cx="779" cy="579" r="4"/>
  </g>

  <!-- Graphic Elements -->
  <g transform="translate(0, 0)">
    
    <rect x="40" y="400" width="720" height="90" fill="#C2D1B2" stroke="#2B2117" stroke-width="2"/>
    <polygon points="260,490 320,400 480,400 540,490" fill="#E8DEC8" stroke="#2B2117" stroke-width="2"/>
    <rect x="120" y="240" width="560" height="160" fill="#E5B242" stroke="#2B2117" stroke-width="3"/>
    <path d="M 340 160 C 340 80, 460 80, 460 160 Z" fill="#2E2D2B" stroke="#2B2117" stroke-width="3"/>
    <line x1="400" y1="80" x2="400" y2="40" stroke="#C99738" stroke-width="3"/>
    <circle cx="400" cy="40" r="7" fill="#C99738" stroke="#2B2117" stroke-width="1.5"/>
    <path d="M 180 200 C 180 140, 260 140, 260 200 Z" fill="#2E2D2B" stroke="#2B2117" stroke-width="2.5"/>
    <line x1="220" y1="140" x2="220" y2="105" stroke="#C99738" stroke-width="2.5"/>
    <path d="M 540 200 C 540 140, 620 140, 620 200 Z" fill="#2E2D2B" stroke="#2B2117" stroke-width="2.5"/>
    <line x1="580" y1="140" x2="580" y2="105" stroke="#C99738" stroke-width="2.5"/>
    <g fill="#FAF6EC" stroke="#2B2117" stroke-width="2">
      
        <path d="M 340 230 A 12 12 0 0 1 360 230 L 360 260 L 340 260 Z"/>
      
        <path d="M 366 230 A 12 12 0 0 1 386 230 L 386 260 L 366 260 Z"/>
      
        <path d="M 392 230 A 12 12 0 0 1 412 230 L 412 260 L 392 260 Z"/>
      
        <path d="M 418 230 A 12 12 0 0 1 438 230 L 438 260 L 418 260 Z"/>
      
        <path d="M 444 230 A 12 12 0 0 1 464 230 L 464 260 L 444 260 Z"/>
      
    </g>
    <polygon points="320,400 360,330 440,330 480,400" fill="#FAF5ED" stroke="#2B2117" stroke-width="2.5"/>
    <path d="M 370 330 A 30 30 0 0 1 430 330 L 430 400 L 370 400 Z" fill="#2A3D2A" stroke="#2B2117" stroke-width="2"/>
    <g fill="#FAF5ED" stroke="#2B2117" stroke-width="1.5">
      
        <rect x="140" y="320" width="10" height="80"/>
      
        <rect x="172" y="320" width="10" height="80"/>
      
        <rect x="204" y="320" width="10" height="80"/>
      
        <rect x="236" y="320" width="10" height="80"/>
      
        <rect x="268" y="320" width="10" height="80"/>
      
        <rect x="300" y="320" width="10" height="80"/>
      
      
        <rect x="480" y="320" width="10" height="80"/>
      
        <rect x="512" y="320" width="10" height="80"/>
      
        <rect x="544" y="320" width="10" height="80"/>
      
        <rect x="576" y="320" width="10" height="80"/>
      
        <rect x="608" y="320" width="10" height="80"/>
      
        <rect x="640" y="320" width="10" height="80"/>
      
    </g>
    
  </g>

  <!-- Bottom Label Ribbon / Plaque -->
  <g transform="translate(400, 554)">
    <rect x="-240" y="-18" width="480" height="36" fill="#F4EDE0" stroke="#2B2117" stroke-width="2"/>
    <rect x="-234" y="-14" width="468" height="28" fill="none" stroke="#7A6652" stroke-width="0.8"/>
    <!-- Left / Right Ribbon Notches -->
    <polygon points="-240,-18 -252,0 -240,18" fill="#ECE2D0" stroke="#2B2117" stroke-width="1.5"/>
    <polygon points="240,-18 252,0 240,18" fill="#ECE2D0" stroke="#2B2117" stroke-width="1.5"/>
    
    <text x="0" y="-1" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="900" letter-spacing="3" fill="#1E1610">
      ISTANA MAIMUN
    </text>
    <text x="0" y="11" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#7A6652">
      MEDAN DELI · MAHAKARYA KESULTANAN DELI 1891
    </text>
  </g>
</svg>