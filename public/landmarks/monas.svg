    <line x1="40" y1="450" x2="760" y2="450" stroke="#7A6652" stroke-width="1" stroke-dasharray="2 3"/>
    <polygon points="220,440 250,380 550,380 580,440" fill="#ECE0CE" stroke="#2B2117" stroke-width="2.5"/>
    <polygon points="250,380 270,350 530,350 550,380" fill="#E2D4BF" stroke="#2B2117" stroke-width="2.5"/>
    <line x1="280" y1="365" x2="520" y2="365" stroke="#2B2117" stroke-width="1"/>
    <line x1="290" y1="355" x2="290" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="308" y1="355" x2="308" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="326" y1="355" x2="326" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="344" y1="355" x2="344" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="362" y1="355" x2="362" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="380" y1="355" x2="380" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="398" y1="355" x2="398" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="416" y1="355" x2="416" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="434" y1="355" x2="434" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="452" y1="355" x2="452" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="470" y1="355" x2="470" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="488" y1="355" x2="488" y2="375" stroke="#2B2117" stroke-width="1.2"/><line x1="506" y1="355" x2="506" y2="375" stroke="#2B2117" stroke-width="1.2"/>
    <polygon points="365,350 375,120 425,120 435,350" fill="#F7F1E6" stroke="#2B2117" stroke-width="2.5"/>
    <line x1="400" y1="120" x2="400" y2="350" stroke="#2B2117" stroke-width="1.5"/>
    <line x1="388" y1="125" x2="385" y2="350" stroke="#B09F88" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="412" y1="125" x2="415" y2="350" stroke="#B09F88" stroke-width="1" stroke-dasharray="4 2"/>
    <rect x="360" y="110" width="80" height="12" fill="#E5D7C2" stroke="#2B2117" stroke-width="2"/>
    <line x1="365" y1="116" x2="435" y2="116" stroke="#2B2117" stroke-width="1"/>
    <path d="M 385 110 C 375 75, 400 45, 400 35 C 400 45, 425 75, 415 110 Z" fill="#C99738" stroke="#2B2117" stroke-width="2"/>
    <path d="M 390 108 C 385 85, 400 65, 400 55 C 400 65, 415 85, 410 108 Z" fill="#E8B954" stroke="#875E1B" stroke-width="1"/>
    <g stroke="#9C7838" stroke-width="1" opacity="0.6">
      <line x1="400" y1="35" x2="400" y2="15"/>
      <line x1="390" y1="40" x2="375" y2="25"/>
      <line x1="410" y1="40" x2="425" y2="25"/>
      <line x1="380" y1="50" x2="355" y2="40"/>
      <line x1="420" y1="50" x2="445" y2="40"/>
    </g>
    <rect x="180" y="440" width="440" height="15" fill="#CBBDA7" stroke="#2B2117" stroke-width="2"/>
    <rect x="150" y="455" width="500" height="15" fill="#BAAC96" stroke="#2B2117" stroke-width="2"/>
    <g fill="#5E6347" stroke="#2B2117" stroke-width="1.5">
      <circle cx="120" cy="425" r="22"/>
      <circle cx="150" cy="420" r="28"/>
      <circle cx="180" cy="430" r="20"/>
      <circle cx="620" cy="430" r="20"/>
      <circle cx="650" cy="420" r="28"/>
      <circle cx="680" cy="425" r="22"/>
    </g>
    
  </g>

  <!-- Bottom Label Ribbon / Plaque -->
  <g transform="translate(400, 554)">
    <rect x="-240" y="-18" width="480" height="36" fill="#F4EDE0" stroke="#2B2117" stroke-width="2"/>
    <rect x="-234" y="-14" width="468" height="28" fill="none" stroke="#7A6652" stroke-width="0.8"/>
    <!-- Left / Right Ribbon Notches -->
    <polygon points="-240,-18 -252,0 -240,18" fill="#ECE2D0" stroke="#2B2117" stroke-width="1.5"/>
    <polygon points="240,-18 252,0 240,18" fill="#ECE2D0" stroke="#2B2117" stroke-width="1.5"/>
    
    <text x="0" y="-1" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="900" letter-spacing="3" fill="#1E1610">
      MONUMEN NASIONAL
    </text>
    <text x="0" y="11" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#7A6652">
      JAKARTA · TUGU KEMERDEKAAN 132M
